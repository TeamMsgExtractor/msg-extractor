[project]
name = "msg_extractor"
version = "0.60.0"
requires-python = ">=3.10"
authors = [
	{name = "Matthew Walker", email = "arceusthe@gmail.com"},
	{name = "Destiny Peterson", email = "mattgwwalker@gmail.com"},
]
readme = "README.rst"
license = "GPL-3.0"
description = "Extracts emails and attachments saved in Microsoft Outlook's .msg files"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
Homepage = "https://github.com/TeamMsgExtractor/msg-extractor"
Documentation = "https://msg-extractor.readthedocs.io/en/latest/"
Repository = "https://github.com/TeamMsgExtractor/msg-extractor.git"
Changelog = "https://github.com/TeamMsgExtractor/msg-extractor/blob/master/CHANGELOG.md"

dependencies = [ # Modules using == are *intentional* and must be checked manually before upgrading.
  "olefile==0.47",
  "tzlocal>=5.0,<6",
  "compressed-rtf>=1.0.6,<2",
  "ebcdic>=1.1.1,<3",
  "beautifulsoup4>=4.11.1,<5",
  "RTFDE>=0.1.1,<0.2",
  "red-black-tree-mod>=1.20,<=1.23",
]

[project.optional-dependencies]
all = [
  "msg_extractor[mime,image,encoding]",
]
mime = [
  "python-magic>=0.4.27,<0.5"
]
image = [
  "Pillow>=11.0.0"
]
encoding = [
  "chardet>=5.0.0,<6"
]

[dependency-groups]
dev = [
  "pytest",
]
docs = [
  "sphinx-rtd-theme"
]

[project.entry-points."console_scripts"]
extract_msg = "extract_msg.__main__:main"

[tool.pyright]
reportUnnecessaryIsInstance = "information"
reportConstantRedefinition = "error"
reportDeprecated = "warning"
