[bdist_wheel]
python-tag=py3

[options.extras_require]
# All doesn't actually install everything, just everything for a normal
# installation. It specifically skips stuff for testing and docs.
all =
    extract-msg[mime]
    extract-msg[image]
    extract-msg[encoding]
    extract-msg[writer]
mime =
    python-magic>=0.4.27,<0.5
image =
    Pillow>=9.5.0,<10
encoding =
    chardet>=3.0.0,<6 # This can probably be unbound.
writer =
    red-black-tree-mod>=1.20, <=1.23
readthedocs =
    sphinx-rtd-theme
test =
    extract-msg[writer]
    pypdf<7.0.0